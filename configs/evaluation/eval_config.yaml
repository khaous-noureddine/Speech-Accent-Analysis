evaluation:
  output_dir: "evaluation_v1"
  batch_size: 8
  device: "cuda"

  models:
    - name: "facebook/wav2vec2-base-960h"
      label: "wav2vec2_base_960h"
      from_checkpoint: false

    - name: "facebook/wav2vec2-large-xlsr-53"
      label: "wav2vec2-large-xlsr-53"
      from_checkpoint: false

    - name: "facebook/wav2vec2-large-xlsr-53"
      label: "condition_C_baseline"
      from_checkpoint: true
      checkpoint_path: "checkpoints/conditions/C/stage_3/best_model"

    - name: "facebook/wav2vec2-large-xlsr-53"
      label: "condition_A_proposed"
      from_checkpoint: true
      checkpoint_path: "checkpoints/conditions/A/stage_2/checkpoint_epoch009.pt"

    - name: "openai/whisper-large-v3"
      label: "whisper_large_v3"
      from_checkpoint: false

    - name: "facebook/hubert-large-ls960-ft"
      label: "hubert_large"
      from_checkpoint: false

  datasets:
    - name: "speech_accent_archive"
      parquet: "data/processed/speech_accents/corpus.parquet"
      transcript_col: "transcript"
      group_col: "native_language"
      audio_col: "audio_path"

    - name: "l2_arctic_eval"
      parquet: "data/processed/l2_arctic/corpus.parquet"
      transcript_col: "transcript"
      group_col: "speaker_id"
      audio_col: "audio_path"

    - name: "arctic_eval"
      parquet: "data/processed/arctic/corpus.parquet"
      transcript_col: "transcript"
      group_col: "speaker_id"
      audio_col: "audio_path"

    - name: "librispeech_dev_clean"
      parquet: "data/processed/librispeech_eval/corpus.parquet"
      transcript_col: "transcript"
      group_col: "speaker_id"
      audio_col: "audio_path"

    - name: "edacc_test"
      parquet: "data/processed/edacc_test/corpus.parquet"
      transcript_col: "transcript"
      group_col: "accent"
      audio_col: "audio_path"
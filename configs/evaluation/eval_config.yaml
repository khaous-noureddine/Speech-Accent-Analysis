# ──────────────────────────────────────────────────────────────────────────
# Evaluation
# ──────────────────────────────────────────────────────────────────────────

evaluation:
  output_dir: "results"
  batch_size: 8
  device: "cuda"

  models:
    # ── Pre-trained HF models (via shortcut) ─────────────────────────────
    - model: "wav2vec2-base-960h"
      label: "wav2vec2_base_960h"

    - model: "xlsr-53-english"
      label: "xlsr53_english_ctc"

    - model: "whisper-large-v3"
      label: "whisper_large_v3"

    - model: "hubert-large"
      label: "hubert_large"

    # ── Condition C — baseline (no Stage 2, fine-tuned on LibriSpeech) ───
    - model: "wav2vec2-large-xlsr53"
      label: "condition_C_baseline"
      from_checkpoint: true
      checkpoint_path: "checkpoints/conditions/C/stage_3/best_model"

    # ── Condition A — proposed (Stage 2 SupCon + fine-tuned on LibriSpeech) ────────────
    - model: "wav2vec2-large-xlsr53"
      label: "condition_A_proposed"
      from_checkpoint: true
      checkpoint_path: "checkpoints/conditions/A/stage_3/best_model"

  datasets:
    - name: "speech_accent_archive"
      parquet: "data/processed/speech_accents/corpus.parquet"
      transcript_col: "transcript"
      group_col: "native_language"
      audio_col: "audio_path"

    - name: "l2_arctic_eval"
      parquet: "data/processed/l2_arctic/corpus.parquet"
      transcript_col: "transcript"
      group_col: "speaker_id"
      audio_col: "audio_path"
      filter_col: "split"
      filter_val: "eval"

    - name: "arctic_eval"
      parquet: "data/processed/arctic/corpus.parquet"
      transcript_col: "transcript"
      group_col: "speaker_id"
      audio_col: "audio_path"

    - name: "librispeech_test_clean"
      parquet: "data/processed/librispeech_test /corpus.parquet"
      transcript_col: "transcript"
      group_col: "speaker_id"
      audio_col: "audio_path"

    - name: "edacc_test"
      parquet: "data/processed/edacc_test/corpus.parquet"
      transcript_col: "transcript"
      group_col: "accent"
      audio_col: "audio_path"
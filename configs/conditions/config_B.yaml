# =============================================================================
# Condition B — UPPER BOUND
# Stage 2 : Contrastive fine-tuning (même que A)
# Stage 3 : ASR fine-tuning sur AESRC2020 train (accented)
# Interprétation : combien reste-t-il d'accent sensitivity après Stage 2 ?
# =============================================================================

data_preparation:
  # même data_preparation que A — Stage 2 identique
  speech_accents:
    raw_data_dir:       "data/raw/speech_accents"
    processed_data_dir: "data/processed/speech_accents"
    parquet_path:       "data/processed/speech_accents/corpus.parquet"
  arctic:
    raw_data_dir:       "data/raw/arctic"
    processed_data_dir: "data/processed/arctic"
    parquet_path:       "data/processed/arctic/corpus.parquet"
  l2_arctic:
    raw_data_dir:       "data/raw/l2_arctic/speakers"
    processed_data_dir: "data/processed/l2_arctic"
    parquet_path:       "data/processed/l2_arctic/corpus.parquet"
  aesrc2020:
    train_parquet: "data/processed/aesrc2020/train/corpus.parquet"
    eval_parquet:  "data/processed/aesrc2020/eval/corpus.parquet"

supervised_contrastive_training:
  # identique à la condition A — réutilise le même checkpoint Stage 2
  data:
    arctic_parquet_path:    "data/processed/arctic/corpus.parquet"
    l2_arctic_parquet_path: "data/processed/l2_arctic/corpus.parquet"
    sample_rate:     16000
    max_audio_len_s: 10.0
    split: "train"
  sampler:
    number_of_workers: 2
    k_utterances: 15
    s_speakers:   20
    n_batches:    100
    seed:         42
  model:
    model_name:      "facebook/wav2vec2-large-xlsr-53"
    proj_hidden_dim: 512
    proj_out_dim:    256
    vocab_size:      32
    min_frozen_layer: 0
    max_frozen_layer: 18
    ctc_lambda:  0.1
    temperature: 0.1
  training:
    epochs:             50
    learning_rate:      2e-5
    warmup_steps:       500
    use_ctc:            true
    tokenizer:          "facebook/wav2vec2-large-960h"
    device:             "cuda"
    checkpoint_dir:     "checkpoints/conditions/A/stage_2"   # même Stage 2 que A
    tensorboard_dir:    "tensorboard/conditions/A/stage_2"
    save_every_n_epochs: 5
    use_mixed_precision: false
  evaluation:
    output_dir:          "evaluation/conditions/A/stage_2"
    eval_every_n_epochs: 5
    eval_n_neg_samples:  1000
    eval_batch_size:     64
    retrieval_ks:        [1, 5, 10]
    eval_metrics:
      - alignment
      - uniformity
      - retrieval_at_5

asr_finetuning:
  data:
    librispeech_train_parquet: "data/processed/aesrc2020/train/corpus.parquet"  # accented !
    librispeech_dev_parquet:   "data/processed/aesrc2020/eval/corpus.parquet"
    max_duration_s: 20.0
    num_workers:    4
  model:
    model_name:            "facebook/wav2vec2-large-xlsr-53"
    stage2_checkpoint:     "checkpoints/conditions/A/stage_2/best"  # même Stage 2 que A
    freeze_encoder_layers: 18
  training:
    output_dir:      "checkpoints/conditions/B/stage_3"
    tensorboard_dir: "tensorboard/conditions/B/stage_3"
    logging_dir:     "logs/conditions/B/stage_3"
    epochs:       30
    batch_size:   16
    backbone_lr:  1e-5
    head_lr:      1e-4
    weight_decay: 1e-2
    warmup_ratio: 0.1
    grad_clip:    1.0
    log_every:    50
    device:       "cuda"
  evaluation:
    eval_every:       1
    eval_max_batches: null
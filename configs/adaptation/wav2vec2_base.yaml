# Stage 2 smoke-test defaults. Main experiments may override the backbone only
# after the smoke protocol has been validated end to end.
backbone_name: facebook/wav2vec2-base
data_root: data/processed/l2_arctic_leave_one_accent_out
output_root: outputs/resubmission/stage2
tokenizer_path: configs/tokenizers/librispeech_char

sample_rate: 16000
max_audio_len_s: 10.0
prompts_per_batch: 8
speakers_per_prompt: 5
batches_per_epoch: 100
dev_prompts_per_batch: 8
dev_speakers_per_prompt: 5
dev_batches: 12

epochs: 50
learning_rate: 0.00002
weight_decay: 0.0001
warmup_steps: 500
gradient_clip: 1.0
temperature: 0.1
ctc_weight: 0.1
projection_hidden_size: 512
projection_size: 256
frozen_transformer_layers: 9
num_workers: 2
mixed_precision: true

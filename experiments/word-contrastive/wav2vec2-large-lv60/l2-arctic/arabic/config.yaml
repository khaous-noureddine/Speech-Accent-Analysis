experiment:
  name: "wav2vec2-large-lv60_word-supcon_l2-arctic"
  stage: 2
  condition: "E"
  loss_mode: "supcon_only"
  fold: "arabic"
  heldout_accent: "arabic"
  seeds: [13, 42, 77]

stage2_adaptation:
  script: "src/accented_asr/adaptation/train.py"

  data:
    parquet_path: "data/processed/l2_arctic_words/arabic/corpus.parquet"
    contrastive_unit: "word"
    sample_rate: 16000
    max_audio_len_s: 2.0
    train_split: "train"
    dev_split: "dev"
    validate_audio: true
    num_workers: 2

  sampler:
    # Each batch contains 16 lexical classes x 5 accents = 80 word segments.
    k_prompts: 16
    s_speakers: 5
    n_batches: 100

  model:
    model_name: "facebook/wav2vec2-large-lv60"
    tokenizer_path: "configs/tokenizers/librispeech_char"
    vocab_size: 32
    projection_hidden_size: 512
    projection_size: 256
    frozen_transformer_layers: 18
    gradient_checkpointing: true
    temperature: 0.1
    ctc_weight: 0.1

  training:
    epochs: 50
    learning_rate: 0.00002
    weight_decay: 0.0001
    warmup_steps: 500
    gradient_clip: 1.0
    use_ctc: false
    mixed_precision: true
    tensorboard: true
    tensorboard_subdir: "tensorboard"
    device: "cuda"
    output_dir: "experiments/word-contrastive/wav2vec2-large-lv60/l2-arctic/arabic/outputs"

  development:
    k_prompts: 16
    s_speakers: 5
    n_batches: 12
    selection_metric: "loss"

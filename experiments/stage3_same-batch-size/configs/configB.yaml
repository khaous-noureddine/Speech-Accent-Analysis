# =============================================================================
# Condition A — Proposed Method
# Stage 2: Supervised Contrastive Learning (Arctic + L2-Arctic)
# Stage 3: ASR fine-tuning on LibriSpeech clean-100
#

# snakemake --configfile experiments/stage3_same-batch-size/configs/configB.yaml --cores 1 eval_compute_wer > experiments/stage3_same-batch-size/logs/B.log 2>&1 &

# snakemake --configfile experiments/stage3_same-batch-size/configs/configB.yaml --cores 1 eval_transcribe > experiments/stage3_same-batch-size/logs/B.log 2>&1 &


# snakemake --configfile experiments/stage3_same-batch-size/configs/configB.yaml --cores 1 eval_compute_wer_ngram_lm > experiments/stage3_same-batch-size/logs/B-eval_ngram_lm_wer.log 2>&1 &

# =============================================================================

experiment:
  name: "stage3_same-batch-size"


# -----------------------------------
data_preparation:
  arctic:
    raw_data_dir:       "data/raw/arctic"
    processed_data_dir: "data/processed/arctic"
    parquet_path:       "data/processed/arctic/corpus.parquet"

  l2_arctic:
    raw_data_dir:       "data/raw/l2_arctic/speakers"
    processed_data_dir: "data/processed/l2_arctic"
    parquet_path:       "data/processed/l2_arctic/corpus.parquet"

  librispeech:
    train_raw_dir:            "data/raw/librispeech/train/LibriSpeech/train-clean-100"
    processed_train_data_dir: "data/processed/librispeech_train"
    parquet_train_path:       "data/processed/librispeech_train/corpus.parquet"

    eval_raw_dir:             "data/raw/librispeech/eval/LibriSpeech/dev-clean"
    processed_eval_data_dir:  "data/processed/librispeech_eval"
    parquet_eval_path:        "data/processed/librispeech_eval/corpus.parquet"

    test_raw_dir:             "data/raw/librispeech/test/LibriSpeech/test-clean"
    processed_test_data_dir:  "data/processed/librispeech_test"
    parquet_test_path:        "data/processed/librispeech_test/corpus.parquet"

# -----------------------------------
supervised_contrastive_training:
  data:
    arctic_parquet_path:    "data/processed/arctic/corpus.parquet"
    l2_arctic_parquet_path: "data/processed/l2_arctic/corpus.parquet"
    sample_rate:     16000
    max_audio_len_s: 10.0
    split:           "train"

  sampler:
    number_of_workers: 2
    k_utterances:      15
    s_speakers:        20
    n_batches:         100
    seed:              42

  model:
    model_name:       "facebook/wav2vec2-large-xlsr-53"
    proj_hidden_dim:  512
    proj_out_dim:     256
    vocab_size:       32
    min_frozen_layer: 0
    max_frozen_layer: 18
    ctc_lambda:       0.1
    temperature:      0.5

  training:
    epochs:              50
    learning_rate:       2e-5
    warmup_steps:        500
    use_ctc:             true
    tokenizer:           "facebook/wav2vec2-large-960h"
    device:              "cuda"
    checkpoint_dir:      "checkpoints/conditions/A/stage_2"
    tensorboard_dir:     "tensorboard/conditions/A/stage_2"
    save_every_n_epochs: 1
    use_mixed_precision: false

  evaluation:
    output_dir:          "evaluation/conditions/A/stage_2"
    eval_every_n_epochs: 1
    eval_n_neg_samples:  1000
    eval_batch_size:     64
    retrieval_ks:        [1, 5, 10]
    eval_metrics:
      - alignment
      - uniformity
      - retrieval_at_5



# -----------------------------------
# Protocol:
#   - max_steps = 35,680 (fixed across all conditions)
#   - batch_size = 16 (reference condition)
#   - audio per update ≈ 16 × 12.69s = 203s
#   - total audio seen ≈ 35,680 × 203s ≈ 2,013h
#
asr_finetuning:
  data:
    dataset:        "aesrc"
    train_parquet:  "data/processed/aesrc/corpus.parquet"
    eval_parquet:   "data/processed/aesrc/corpus.parquet"
    max_duration_s: 20.0
    num_workers:    4
  
  model:
    model_name:        "facebook/wav2vec2-large-xlsr-53"
    stage2_checkpoint: "checkpoints/conditions/A/stage_2/checkpoint_epoch049.pt"

  training:
    output_dir:       "checkpoints/conditions/B/stage_3"
    tensorboard_dir:  "tensorboard/conditions/B/stage_3"
    logging_dir:      "logs/conditions/B/stage_3"
    epochs:           999

    max_steps:        50000
    batch_size:       48
    
    backbone_lr:      1e-5
    head_lr:          1e-4
    weight_decay:     1e-2
    warmup_ratio:     0.1
    grad_clip:        1.0
    log_every:        50
    save_every:       999
    save_every_steps: 5000
    device:           "cuda"

  evaluation:
    eval_every:       999
    eval_every_steps: 500
    eval_max_batches: null





# ──────────────────────────────────────────────────────────────────────────
# Evaluation
# ──────────────────────────────────────────────────────────────────────────

evaluation:
  output_dir: "results"
  batch_size: 8
  device: "cuda"

  ngram_lm:
    lm_path: "language_models/patrickvonplaten-wav2vec2-base-100h-with-lm/language_model/4-gram.bin"
    alpha: 0.5
    beta: 1.0
    beam_width: 100


  models:
    # ── Condition B — (SupCon + asr aesrc) 
    - model: "wav2vec2-large-xlsr53"
      label: "condition_B"
      from_checkpoint: true
      # checkpoint_path: "checkpoints/conditions/B/stage_3/best_model"
      checkpoint_path: "checkpoints/conditions/B/stage_3/checkpoint_step030000.pt"


  datasets:
    - name: "aesrc_test"
      parquet: "data/processed/aesrc/corpus.parquet"
      transcript_col: "transcript"
      group_col: "speaker_id"
      audio_col: "audio_path"

    - name: "librispeech_test_clean"
      parquet: "data/processed/librispeech_test/corpus.parquet"
      transcript_col: "transcript"
      group_col: "speaker_id"
      audio_col: "audio_path"

    - name: "speech_accent_archive"
      parquet: "data/processed/speech_accents/corpus.parquet"
      transcript_col: "transcript"
      group_col: "native_language"
      audio_col: "audio_path"

    - name: "l2_arctic_eval"
      parquet: "data/processed/l2_arctic/corpus.parquet"
      transcript_col: "transcript"
      group_col: "speaker_id"
      audio_col: "audio_path"
      filter_col: "split"
      filter_val: "eval"

    - name: "arctic_eval"
      parquet: "data/processed/arctic/corpus.parquet"
      transcript_col: "transcript"
      group_col: "speaker_id"
      audio_col: "audio_path"

    - name: "edacc_test"
      parquet: "data/processed/edacc_test/corpus.parquet"
      transcript_col: "transcript"
      group_col: "accent"
      audio_col: "audio_path"
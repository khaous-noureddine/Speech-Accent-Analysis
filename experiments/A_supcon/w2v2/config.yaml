# =============================================================================
# Ablation — SupCon only (exactly like condition A)
# Stage 2: Supervised Contrastive Learning on l2arctic
# Stage 3: ASR fine-tuning on LibriSpeech clean-100
# We use the base model instead of finetuned model (facebook/wav2vec2-large)


# Launch:

# snakemake \
#   --configfile experiments/A_supcon/w2v2/config.yaml \
#   --cores 1 \
#   --latency-wait 30 \
#   stage2_supcon_dtw_l2cv \
#   > logs/A_supcon_stage2.log 2>&1

# =============================================================================

# -----------------------------------
data_preparation:
  l2_arctic:
    raw_data_dir:       "data/raw/l2_arctic/speakers"
    processed_data_dir: "data/processed/l2_arctic"
    parquet_path:       "data/processed/l2_arctic/corpus.parquet"

  librispeech:
    train_raw_dir:            "data/raw/librispeech/train/LibriSpeech/train-clean-100"
    processed_train_data_dir: "data/processed/librispeech_train"
    parquet_train_path:       "data/processed/librispeech_train/corpus.parquet"
    eval_raw_dir:             "data/raw/librispeech/eval/LibriSpeech/dev-clean"
    processed_eval_data_dir:  "data/processed/librispeech_eval"
    parquet_eval_path:        "data/processed/librispeech_eval/corpus.parquet"




# -----------------------------------
experiment:
  name: "supcon-only_w2v2"



supervised_contrastive_training:
  script: "stage2/supcon_train_l2cv_dtw_with_rep_eval.py"

  data:
    parquet_path:      "data/processed/l2_arctic_cv/fold_00/corpus.parquet"
    sample_rate:       16000
    max_audio_len_s:   10.0
    label_col:         "prompt_id"
    num_workers:       2
    train_split:       "train"
    dev_split:         "dev"
    validate_audio:    true

  sampler:
    k_utterances:      10
    s_speakers:        4
    n_batches:         100
    seed:              42

  model:
    model_name:        "facebook/wav2vec2-large"
    proj_hidden_dim:   512
    proj_out_dim:      256
    vocab_size:        32

    min_frozen_layer:  0
    max_frozen_layer:  0

    ctc_lambda:        1
    temperature:       0.1

    freeze_feature_extractor:  true
    freeze_feature_projection: true
    gradient_checkpointing:    true

  training:
    epochs:              30
    learning_rate:       1e-5
    weight_decay:        1e-4
    warmup_steps:        100
    grad_clip:           1.0
    use_ctc:             false
    tokenizer:           "facebook/wav2vec2-large"
    device:              "cuda"
    use_mixed_precision: false
    log_every_n_batches: 1

    checkpoint_dir:      "experiments/A_supcon/w2v2/checkpoints/stage_2" 
    tensorboard_dir:     "experiments/A_supcon/w2v2/tensorboard/stage_2"
    save_every_n_epochs: 15

  evaluation:
    eval_every_n_epochs: 1

    eval_k_utterances:   8
    eval_s_speakers:     3
    eval_n_batches:      20
    eval_max_batches:    20

    eval_n_neg_samples:  5000
    eval_output_dir:     "experiments/A_supcon/w2v2/eval/stage_2_representation"

    retrieval_ks:        [1, 5, 10]
    eval_metrics:
      - alignment
      - uniformity
      - retrieval_at_1
      - retrieval_at_5
      - retrieval_at_10

    best_metric:         "alignment_ratio_backbone"


slurm:
  partition: GPU-A100
  mem:       48G


# -----------------------------------
# ASR finetuning 
# Protocol:
#   - max_steps = 35,680 (fixed across all conditions)
#   - batch_size = 16 (reference condition)
#   - audio per update ≈ 16 × 12.69s = 203s
#   - total audio seen ≈ 35,680 × 203s ≈ 2,013h
#
asr_finetuning:
  data:
    dataset:        "librispeech"
    train_parquet:  "data/processed/librispeech_train/corpus.parquet"
    eval_parquet:   "data/processed/librispeech_eval/corpus.parquet"
    max_duration_s: 20.0
    num_workers:    4
  
  model:
    model_name:        "facebook/wav2vec2-large"
    stage2_checkpoint: "experiments/A_supcon/w2v2/checkpoints/stage_2/checkpoint_epoch049.pt"

  training:
    output_dir:       "experiments/A_supcon/w2v2/checkpoints/stage_3"
    tensorboard_dir:  "experiments/A_supcon/w2v2/tensorboard/stage_3"
    logging_dir:      "logs/conditions/A_supcon-only/stage_3"
    epochs:           999

    max_steps:        35680
    batch_size:       16
    
    backbone_lr:      1e-5
    head_lr:          1e-4
    weight_decay:     1e-2
    warmup_ratio:     0.1
    grad_clip:        1.0
    log_every:        50
    save_every:       999
    save_every_steps: 5000
    device:           "cuda"

  evaluation:
    eval_every:       999
    eval_every_steps: 5000
    eval_max_batches: null






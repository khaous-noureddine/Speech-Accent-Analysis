evaluation:
  name: wav2vec2-large-lv60_multidomain-ctc_korean_full-transformer_evaluation
  model: wav2vec2-large-lv60
  objective: wav2vec2-large-lv60_multidomain-ctc_korean_full-transformer
  fold: korean
  seed: 13
  source: joint
  checkpoint: experiments/baselines/prior-methods/librispeech-100h/wav2vec2-large-lv60/multidomain-ctc/korean/full-transformer/outputs/seed=13/checkpoint_best.pt
  stage3_config: null
  joint_config: experiments/baselines/prior-methods/librispeech-100h/wav2vec2-large-lv60/multidomain-ctc/korean/full-transformer/config.yaml
  decoder: greedy
  output_dir: experiments/baselines/prior-methods/librispeech-100h/wav2vec2-large-lv60/multidomain-ctc/korean/full-transformer/outputs
  batch_size: 2
  num_workers: 2
  device: auto
  datasets:
    l2_arctic:
      split: test
      parquet: data/processed/l2_arctic_leave_one_accent_out/korean/corpus.parquet
      raw_dir: data/raw/l2_arctic/speakers
    librispeech_test_clean:
      split: test
      parquet: data/processed/librispeech_test_clean/corpus.parquet
      raw_dir: data/raw/librispeech/test/LibriSpeech/test-clean
    librispeech_test_other:
      split: "test"
      parquet: "data/processed/librispeech_test_other/corpus.parquet"
      raw_dir: "data/raw/librispeech/test/LibriSpeech/test-other"
    aesrc:
      split: test
      parquet: data/processed/aesrc/corpus.parquet
      raw_dir: data/raw/aesrc/data
    speech_accent_archive:
      split: test
      parquet: data/processed/speech_accent_archive/corpus.parquet
      raw_dir: data/raw/speech_accent_archive
    edacc:
      split: test
      parquet: data/processed/edacc/corpus.parquet
      raw_dir: data/raw/edacc

asr_finetuning:
  data:
    dataset:        "aesrc"
    train_parquet:  "data/processed/aesrc/corpus.parquet"
    eval_parquet:   "data/processed/aesrc/corpus.parquet"
    max_duration_s: 20.0
    num_workers:    4

  model:
    model_name:        "facebook/wav2vec2-large-xlsr-53"
    stage2_checkpoint: "experiments/cross-validation/fold_00/checkpoints/stage_2/checkpoint_epoch050.pt"

  training:
    output_dir:       "checkpoints/stage_3"
    tensorboard_dir:  "tensorboard/stage_3"
    logging_dir:      "logs/stage_3"

    epochs:           999
    max_steps:        30000
    batch_size:       48

    backbone_lr:      1e-5
    head_lr:          1e-4
    weight_decay:     1e-2
    warmup_ratio:     0.1
    grad_clip:        1.0

    log_every:        50
    save_every:       999
    save_every_steps: 5000
    device:           "cuda"

  evaluation:
    eval_every:       999
    eval_every_steps: 5000
    eval_max_batches: null

evaluation:
  output_dir: "results/stage_3"
  batch_size: 8
  device: "cuda"

  models:
    - model: "wav2vec2-large-xlsr53"
      label: "fold_00_condition_B_aesrc_stage3"
      from_checkpoint: true
      checkpoint_path: "checkpoints/stage_3/checkpoint_step030000.pt"

  datasets:
    # - name: "aesrc_test"
    #   parquet: "data/processed/aesrc/corpus.parquet"
    #   transcript_col: "transcript"
    #   group_col: "accent"
    #   audio_col: "audio_path"

    - name: "librispeech_test_clean"
      parquet: "data/processed/librispeech_test/corpus.parquet"
      transcript_col: "transcript"
      group_col: "speaker_id"
      audio_col: "audio_path"

    - name: "l2_arctic_cv_test"
      parquet: "data/processed/l2_arctic_cv/fold_00/corpus.parquet"
      transcript_col: "transcript"
      group_col: "native_language"
      audio_col: "audio_path"
      filter_col: "split"
      filter_val: "test"




evaluation:
  name: sequential-l2-ctc-spanish-seed-42
  model: wav2vec2-large-lv60
  objective: ctc
  fold: spanish
  seed: 42
  checkpoint: experiments/sequential-l2-adaptation/librispeech-100h/wav2vec2-large-lv60/spanish/outputs/seed=42/ctc/checkpoint_best.pt
  stage3_config: null
  joint_config: null
  sequential_config: experiments/sequential-l2-adaptation/librispeech-100h/wav2vec2-large-lv60/spanish/seed=42/config.yaml
  source: sequential_l2
  decoder: greedy
  output_dir: experiments/sequential-l2-adaptation/librispeech-100h/wav2vec2-large-lv60/spanish/evaluation/ctc
  batch_size: 2
  num_workers: 2
  device: auto
  datasets:
    l2_arctic:
      split: test
      parquet: data/processed/l2_arctic_leave_one_accent_out/spanish/corpus.parquet
      raw_dir: data/raw/l2_arctic/speakers
    librispeech_test_clean:
      split: test
      parquet: data/processed/librispeech_test_clean/corpus.parquet
      raw_dir: data/raw/librispeech/test/LibriSpeech/test-clean
    librispeech_test_other:
      split: test
      parquet: data/processed/librispeech_test_other/corpus.parquet
      raw_dir: data/raw/librispeech/test/LibriSpeech/test-other
    aesrc:
      split: test
      parquet: data/processed/aesrc/corpus.parquet
      raw_dir: data/raw/aesrc/data
    speech_accent_archive:
      split: test
      parquet: data/processed/speech_accent_archive/corpus.parquet
      raw_dir: data/raw/speech_accent_archive
    edacc:
      split: test
      parquet: data/processed/edacc/corpus.parquet
      raw_dir: data/raw/edacc

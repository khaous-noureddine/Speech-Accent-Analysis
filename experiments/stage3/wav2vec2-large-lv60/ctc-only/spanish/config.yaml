experiment:
  name: "wav2vec2-large-lv60_ctc-only_librispeech-100"
  stage: 3
  objective: "ctc-only"
  fold: "spanish"
  seeds: [13, 42, 77]

stage3_finetuning:
  data:
    train_parquet: "data/processed/librispeech_train/corpus.parquet"
    dev_parquet: "data/processed/librispeech_eval/corpus.parquet"
    train_raw_dir: "data/raw/librispeech/train/LibriSpeech/train-clean-100"
    dev_raw_dir: "data/raw/librispeech/eval/LibriSpeech/dev-clean"
    train_subset: "train-clean-100"
    dev_subset: "dev-clean"
    sample_rate: 16000
    max_duration_s: 20.0
    validate_audio: true
    num_workers: 4

  model:
    model_name: "facebook/wav2vec2-large-lv60"
    tokenizer_path: "configs/tokenizers/librispeech_char"
    stage2_output_dir: "experiments/stage2/wav2vec2-large-lv60/ctc-only/spanish/outputs"
    gradient_checkpointing: true
    mask_time_prob: 0.05
    mask_time_length: 10
    mask_feature_prob: 0.008
    mask_feature_length: 64
    layerdrop: 0.1
    activation_dropout: 0.1

  training:
    output_dir: "experiments/stage3/wav2vec2-large-lv60/ctc-only/spanish/outputs"
    batch_size: 16
    epochs: 999
    max_steps: 50000
    backbone_lr: 0.00001
    head_lr: 0.0001
    weight_decay: 0.01
    warmup_ratio: 0.1
    hold_ratio: 0.4
    final_lr_scale: 0.05
    freeze_backbone_steps: 10000
    freeze_feature_encoder: true
    gradient_clip: 1.0
    mixed_precision: true
    tensorboard: true
    tensorboard_subdir: "tensorboard"
    log_every_steps: 100
    device: "cuda"

  evaluation:
    selection_metric: "dev_wer"
    eval_every_steps: 5000

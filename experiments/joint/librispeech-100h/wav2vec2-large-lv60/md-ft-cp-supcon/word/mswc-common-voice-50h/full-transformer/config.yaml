experiment:
  name: wav2vec2-large-lv60_md-ft-cp-supcon-word_mswc-cv-50h
  task: joint_ctc_auxiliary
  fold: mswc-common-voice-50h
  heldout_accent: from_report
  seeds:
  - 13
joint_training:
  data:
    librispeech_train_parquet: data/processed/librispeech_train/corpus.parquet
    librispeech_dev_parquet: data/processed/librispeech_eval/corpus.parquet
    librispeech_train_raw_dir: data/raw/librispeech/train/LibriSpeech/train-clean-100
    librispeech_dev_raw_dir: data/raw/librispeech/eval/LibriSpeech/dev-clean
    contrastive_unit: word
    contrastive_parquet: data/processed/mswc_common_voice_words/en_50h_heldout_accent/corpus.parquet
    sample_rate: 16000
    max_librispeech_duration_s: 20.0
    max_contrastive_duration_s: 1.0
    validate_audio: true
    num_workers: 4
  sampler:
    librispeech_batch_size: 16
    prompts_per_batch: 16
    speakers_per_prompt: 5
    contrastive_batches_per_cycle: 100
    contrastive_dev_batches: 12
  model:
    model_name: facebook/wav2vec2-large-lv60
    tokenizer_path: configs/tokenizers/librispeech_char
    projection_hidden_size: 512
    projection_size: 256
    temperature: 0.1
    frozen_transformer_layers: 0
    freeze_feature_encoder: true
    gradient_checkpointing: true
  training:
    head_warmup_epochs: 1
    max_steps: 50000
    supcon_weight: 0.1
    backbone_lr: 1.0e-05
    head_lr: 0.0001
    projection_lr: 1.0e-05
    weight_decay: 0.01
    scheduler_warmup_ratio: 0.1
    scheduler_hold_ratio: 0.4
    final_lr_scale: 0.05
    gradient_clip: 1.0
    mixed_precision: true
    tensorboard: true
    tensorboard_subdir: tensorboard
    device: cuda
    log_every_steps: 100
    output_dir: experiments/joint/librispeech-100h/wav2vec2-large-lv60/md-ft-cp-supcon/word/mswc-common-voice-50h/full-transformer/outputs
    auxiliary_objective: multidomain_ctc_supcon
    auxiliary_weight: 0.1
  evaluation:
    selection_metric: librispeech_dev_wer
    eval_every_steps: 5000

evaluation:
  name: wav2vec2-large-lv60_librispeech-960_joint-supcon_arabic_evaluation
  model: wav2vec2-large-lv60
  objective: wav2vec2-large-lv60_librispeech-960_joint-supcon_arabic
  fold: arabic
  seed: 13
  source: joint
  checkpoint: experiments/joint/librispeech-960h/wav2vec2-large-lv60/utterance-supcon/arabic/full-transformer/outputs/seed=13/checkpoint_best.pt
  stage3_config: null
  joint_config: experiments/joint/librispeech-960h/wav2vec2-large-lv60/utterance-supcon/arabic/full-transformer/config.yaml
  decoder: greedy
  output_dir: experiments/joint/librispeech-960h/wav2vec2-large-lv60/utterance-supcon/arabic/full-transformer/outputs
  batch_size: 2
  num_workers: 2
  device: auto
  datasets:
    l2_arctic:
      split: test
      parquet: data/processed/l2_arctic_leave_one_accent_out/arabic/corpus.parquet
      raw_dir: data/raw/l2_arctic/speakers
    librispeech_test_clean:
      split: test
      parquet: data/processed/librispeech_test_clean/corpus.parquet
      raw_dir: data/raw/librispeech/test/LibriSpeech/test-clean
    aesrc:
      split: test
      parquet: data/processed/aesrc/corpus.parquet
      raw_dir: data/raw/aesrc/data
    speech_accent_archive:
      split: test
      parquet: data/processed/speech_accent_archive/corpus.parquet
      raw_dir: data/raw/speech_accent_archive
    edacc:
      split: test
      parquet: data/processed/edacc/corpus.parquet
      raw_dir: data/raw/edacc

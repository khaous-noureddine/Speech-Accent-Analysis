[workspace]
authors = ["noureddine.khaous <noureddine.khaous@etu.u-paris.fr>"]
channels = ["conda-forge"]
name = "accented-speech-recognition"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
[dependencies]
numpy = ">=2.4.3,<3"
pandas = ">=3.0.2,<4"
loguru = ">=0.7.3,<0.8"
tqdm = ">=4.67.3,<5"
pyarrow = "==24.0.0"
ffmpeg = ">=8.0.1,<9"


[pypi-dependencies]
soundfile = ">=0.13.1, <0.14"
praat-parselmouth = ">=0.4.7, <0.5"
